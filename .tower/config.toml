# Shared Tower settings for the AWF Go module.
[extensions]
disabled = []

# Avoid rebuilding the AST index after every short gap between agent calls.
[daemon]
idle_timeout_secs = 300

[lsp]
idle_timeout_secs = 300

[lsp.go]
command = "gopls"
args = []
extensions = ["go"]

# Keep the existing change-driven formatting, using the project's gofumpt and
# goimports configuration without downloading a second formatter toolchain.
[formatter.tools.golangci]
argv = ["golangci-lint", "fmt", "--stdin"]
extensions = ["go"]

