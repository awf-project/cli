name: mcp-proxy-known-external-operation
version: "1.0.0"
author: test
states:
  initial: start
  start:
    type: agent
    provider: claude
    prompt: "Test prompt"
    on_success: end
    mcp_proxy:
      enable: true
      plugin_tools:
        - plugin: awf-plugin-validation-test
          expose:
            - awf-plugin-validation-test.echo
  end:
    type: terminal
    status: success
    message: "Done"
