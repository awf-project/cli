name: tracker-search
description: Search issues through the configured tracker backend

inputs:
  - name: backend
    type: string
    required: false
    default: ""
    description: Optional tracker backend override
  - name: query
    type: string
    required: true
    description: Issue search query

states:
  initial: search_issues

  search_issues:
    type: operation
    operation: tracker.search
    inputs:
      backend: "{{inputs.backend}}"
      query: "{{inputs.query}}"
    on_success: success
    on_failure: failure

  success:
    type: terminal
    status: success

  failure:
    type: terminal
    status: failure
